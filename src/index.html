<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Строим из дерева — v5.3</title>
<style>
  html, body { margin: 0; height: 100%; font-family: Segoe UI, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #bar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; background: #1b212b; border-bottom: 1px solid #2a3542;
  }
  #info { color: #cfd8e3; font-size: 14px; }
  #bar button, #bar select {
    padding: 6px 14px; font-size: 13px; color: #cfd8e3;
    background: #2a3542; border: 1px solid #3a4a5a; border-radius: 4px;
    cursor: pointer;
  }
  #bar button.active { background: #2f6f4f; border-color: #4caf7d; color: #fff; }
  #bar button.danger:hover { background: #5a2a2a; border-color: #c05050; }
  #scene { flex: 1; position: relative; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="drawBtn">Нарисовать стену</button>
    <button id="deleteBtn" class="danger">Удалить</button>
    <select id="sectionSel" title="Сечение доски каркаса"></select>
    <div id="info">Загрузка...</div>
  </div>
  <div id="scene"></div>
</div>
<script src="lib/three.min.js"></script>
<script>
  if (typeof THREE === 'undefined') {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
  }
</script>
<script src="core/model.js"></script>
<script src="core/norms.js"></script>
<script src="core/calc.js"></script>
<script src="ui/viewer3d.js"></script>
<script src="app.js"></script>
</body>
</html>
